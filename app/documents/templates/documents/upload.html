{% extends "base.html" %}
{% block title %}Upload Document{% endblock %}
{% block page_title %}Upload Document{% endblock %}

{% block content %}
<div class="profile-shell" style="max-width:540px;margin:0 auto">
<div class="profile-card">
  <div style="margin-bottom:14px">
    <a href="{{ url_for('documents.document_hub') }}" class="btn btn-outline btn-sm">&larr; Back</a>
  </div>
  <h3 style="margin:0 0 16px">📁 Upload Document</h3>

  <form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="entity_type" value="vehicle">

    <div style="display:grid;gap:12px">
      <div>
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px">Vehicle Number *</label>
        <input type="text" name="entity_id" class="form-control" required placeholder="e.g. 1/80900">
      </div>

      <div>
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px">Document Name *</label>
        <input type="text" name="doc_name" class="form-control" required placeholder="e.g. Mulkiya Registration">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px">Category</label>
          <select name="doc_category" class="form-control">
            <option value="Registration" selected>Registration</option>
            <option value="Insurance">Insurance</option>
            <option value="License">License</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px">Expiry Date</label>
          <input type="date" name="expiry_date" class="form-control">
        </div>
      </div>

      <div>
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px">File (PDF) *</label>
        <input type="file" name="file" class="form-control" required accept=".pdf">
      </div>

      <div>
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px">Notes</label>
        <textarea name="notes" class="form-control" rows="2" placeholder="Optional"></textarea>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;margin-top:18px;font-size:0.95rem;font-weight:600">
      ⬆ Upload Document
    </button>
  </form>
</div>
</div>
{% endblock %}
