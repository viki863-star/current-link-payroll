<link rel="stylesheet" href="{{ url_for('static', filename='ai_chat.css', v='20260704c') }}">

<button id="aiChatToggle" class="ai-chat-toggle" aria-label="AI Assistant">
  <div class="ai-chat-toggle-pulse"></div>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
  </svg>
</button>

<div id="aiChatPanel" class="ai-chat-panel">
    <div class="ai-chat-header">
    <div class="ai-chat-avatar">AI</div>
    <div class="ai-chat-header-info">
      <div class="ai-chat-header-name">ERP Assistant</div>
      <div class="ai-chat-header-status">Online</div>
    </div>
    <div class="ai-chat-header-actions">
      <div class="ai-chat-lang">
        <button id="aiLangEn" class="is-active">ENG</button>
        <button id="aiLangUr">اردو</button>
      </div>
      <button id="aiChatClear" class="ai-chat-close" title="Clear chat" aria-label="Clear chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
      <button id="aiChatClose" class="ai-chat-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="aiChatMessages" class="ai-chat-messages">
    <div class="ai-chat-msg assistant">
      <div>Hi! I'm your ERP assistant. Ask me about data, or tap <strong>Tripsheet Entry</strong> below.</div>
    </div>
  </div>

  <div id="aiChatListening" class="ai-chat-listening">
    <span class="listening-pulse"></span>
    <span id="aiChatListeningText">Listening... speak now</span>
  </div>

  <div id="aiChatTyping" class="ai-chat-typing" style="display:none">
    <span></span><span></span><span></span>
  </div>

  <div class="ai-chat-footer">
    <textarea id="aiChatInput" class="ai-chat-input" rows="1" placeholder="Ask me anything..." style="height:auto;overflow:hidden"></textarea>
    <button id="aiChatMic" class="ai-chat-mic" aria-label="Push to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <button id="aiChatSend" class="ai-chat-send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>

<script src="{{ url_for('static', filename='ai_chat.js', v='20260704c') }}"></script>
