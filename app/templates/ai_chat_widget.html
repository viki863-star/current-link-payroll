<link rel="stylesheet" href="{{ url_for('static', filename='ai_chat.css', v='20260704f') }}">

<button id="aiChatToggle" class="ai-chat-toggle" aria-label="AI Assistant">
  <div class="ai-chat-toggle-pulse"></div>
  <svg viewBox="0 0 100 100" fill="none">
    <!-- Robot head -->
    <rect x="25" y="30" width="50" height="42" rx="12" fill="currentColor" opacity="0.9"/>
    <!-- Antenna -->
    <line x1="50" y1="18" x2="50" y2="30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="15" r="4" fill="currentColor"/>
    <!-- Eyes -->
    <ellipse cx="38" cy="50" rx="5" ry="5.5" fill="white"/>
    <ellipse cx="62" cy="50" rx="5" ry="5.5" fill="white"/>
    <circle cx="39" cy="49" r="2.5" fill="#1e293b"/>
    <circle cx="63" cy="49" r="2.5" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M38 63 Q50 72 62 63" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Headset -->
    <rect x="18" y="38" width="10" height="16" rx="5" fill="currentColor" opacity="0.7"/>
    <rect x="72" y="38" width="10" height="16" rx="5" fill="currentColor" opacity="0.7"/>
    <path d="M28 50 Q28 20 50 18" stroke="currentColor" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M72 50 Q72 20 50 18" stroke="currentColor" stroke-width="2.5" fill="none" opacity="0.5"/>
    <!-- Neck -->
    <rect x="42" y="72" width="16" height="8" rx="3" fill="currentColor" opacity="0.6"/>
  </svg>
</button>

<div id="aiChatPanel" class="ai-chat-panel">
    <div class="ai-chat-header">
    <div class="ai-chat-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
        <rect x="5" y="7" width="14" height="12" rx="3"/>
        <line x1="12" y1="4" x2="12" y2="7" stroke-width="2"/>
        <circle cx="12" cy="3" r="1.5"/>
        <circle cx="9" cy="13" r="1.5" fill="currentColor"/>
        <circle cx="15" cy="13" r="1.5" fill="currentColor"/>
        <path d="M9 17 Q12 19.5 15 17"/>
        <rect x="2" y="10" width="4" height="6" rx="2" opacity="0.6"/>
        <rect x="18" y="10" width="4" height="6" rx="2" opacity="0.6"/>
      </svg>
    </div>
    <div class="ai-chat-header-info">
      <div class="ai-chat-header-name">ERP Assistant</div>
      <div class="ai-chat-header-status">Online</div>
    </div>
    <div class="ai-chat-header-actions">
      <div class="ai-chat-lang">
        <button id="aiLangEn" class="is-active">ENG</button>
        <button id="aiLangUr">اردو</button>
      </div>
      <button id="aiChatClear" class="ai-chat-close" title="Clear chat" aria-label="Clear chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
      <button id="aiChatClose" class="ai-chat-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="aiChatMessages" class="ai-chat-messages">
    <div class="ai-chat-msg assistant">
      <div>Hi! I'm your ERP assistant. Ask me about data, or tap <strong>Tripsheet Entry</strong> below.</div>
    </div>
  </div>

  <div id="aiChatListening" class="ai-chat-listening">
    <span class="listening-pulse"></span>
    <span id="aiChatListeningText">Listening... speak now</span>
  </div>

  <div id="aiChatTyping" class="ai-chat-typing" style="display:none">
    <span></span><span></span><span></span>
  </div>

  <div class="ai-chat-footer">
    <textarea id="aiChatInput" class="ai-chat-input" rows="1" placeholder="Ask me anything..." style="height:auto;overflow:hidden"></textarea>
    <button id="aiChatMic" class="ai-chat-mic" aria-label="Push to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <button id="aiChatSend" class="ai-chat-send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>

<script src="{{ url_for('static', filename='ai_chat.js', v='20260704f') }}"></script>
