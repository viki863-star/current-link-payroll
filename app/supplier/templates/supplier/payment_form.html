{% extends "base.html" %}
{% block title %}{{ 'Edit' if pay else 'Record' }} Payment{% endblock %}
{% block page_title %}Payment{% endblock %}

{% block content %}
<div class="form-shell" style="max-width:540px">
<style>
.pf-wrap { background:#fff; border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.pf-hdr { background:var(--primary); padding:14px 22px; display:flex; align-items:center; gap:10px; }
.pf-hdr h3 { margin:0; font-size:0.95rem; font-weight:700; color:#fff; }
.pf-hdr .back { margin-left:auto; color:rgba(255,255,255,0.85); font-size:0.78rem; text-decoration:none; }
.pf-hdr .back:hover { color:#fff; }
.pf-body { padding:20px 22px 22px; }
.pf-row { margin-bottom:14px; }
.pf-row label { display:block; font-size:0.7rem; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:4px; }
.pf-row .form-control { font-size:0.85rem; }
.pf-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>

<div class="pf-wrap">
  <div class="pf-hdr">
    <h3>💳 {{ 'Edit' if pay else 'Record' }} Payment</h3>
    <a href="{{ url_for('supplier.supplier_profile', sup_id=s.id, tab='payments') }}" class="back">← Back</a>
  </div>
  <div class="pf-body">
    <p style="font-size:0.85rem;color:var(--muted);margin:0 0 14px">
      Supplier: <strong style="color:#0f172a">{{ s.supplier_name }}</strong>
      <span class="mono" style="font-size:0.78rem;color:var(--muted)"> · {{ s.supplier_code }}</span>
    </p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="pf-grid-2">
        <div class="pf-row">
          <label>Payment Date</label>
          <input type="date" name="payment_date" value="{{ pay.payment_date or today }}" class="form-control">
        </div>
        <div class="pf-row">
          <label>Amount *</label>
          <input type="number" name="amount" step="0.01" min="0" class="form-control" required placeholder="0.00" value="{{ pay.amount or '' }}">
        </div>
      </div>

      <div class="pf-row">
        <label>Invoice (optional)</label>
        <select name="invoice_id" class="form-control">
          <option value="">— No Invoice —</option>
          {% for inv in invoices %}
          <option value="{{ inv.id }}" {{ 'selected' if pay and pay.invoice_id == inv.id else '' }}>{{ inv.invoice_no }} — AED {{ "%.0f"|format(inv.total_amount) }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="pf-grid-2">
        <div class="pf-row">
          <label>Payment Method</label>
          <select name="payment_method" class="form-control">
            {% for m in ['Cash','Bank Transfer','Cheque','Card'] %}
            <option value="{{ m }}" {{ 'selected' if pay and pay.payment_method == m else '' }}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="pf-row">
          <label>Reference No.</label>
          <input type="text" name="reference_no" class="form-control" placeholder="Optional" value="{{ pay.reference_no or '' }}">
        </div>
      </div>

      <div class="pf-row">
        <label>Fund Source</label>
        <select name="fund_source" class="form-control">
          <option value="cash_bank" {{ 'selected' if not pay or pay.fund_source == 'cash_bank' else '' }}>Cash / Bank</option>
          <option value="owner_fund" {{ 'selected' if pay and pay.fund_source == 'owner_fund' else '' }}>Owner Fund</option>
        </select>
      </div>

      <div class="pf-row">
        <label>Notes</label>
        <textarea name="notes" class="form-control" rows="2">{{ pay.notes or '' }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;padding:10px">{{ 'Update' if pay else 'Save' }} Payment</button>
    </form>
  </div>
</div>
</div>
{% endblock %}
