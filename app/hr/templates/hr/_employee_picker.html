{% macro employee_picker(employees, name='employee_id', required=True, placeholder='Type name or ID...') %}
<div class="qt-search" data-name="{{ name }}" {% if required %}data-required="1"{% endif %}>
    <input type="hidden" name="{{ name }}" value="" class="qt-search-hidden">
    <div class="qt-search-field">
        <span class="qt-search-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        </span>
        <input type="text" class="qt-search-input" autocomplete="off" placeholder="{{ placeholder }}">
        <span class="qt-search-clear" title="Clear">&times;</span>
    </div>
    <div class="qt-search-list">
        <div class="qt-search-empty">No employee found</div>
        {% for e in employees %}
        <button type="button" class="qt-search-item" data-id="{{ e.employee_id }}" data-query="{{ e.full_name|lower }} {{ e.employee_id|lower }} {{ e.employee_type|lower }}">
            <span class="qt-search-avatar">{{ e.full_name[:1]|upper }}</span>
            <span class="qt-search-meta">
                <span class="qt-search-name">{{ e.full_name }}</span>
                <span class="qt-search-id">{{ e.employee_id }} &middot; {{ e.employee_type }}</span>
            </span>
            <span class="qt-search-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="13" height="13"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
        </button>
        {% endfor %}
    </div>
</div>
{% endmacro %}
