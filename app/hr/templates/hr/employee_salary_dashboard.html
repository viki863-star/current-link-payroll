{% extends "base.html" %}
{% block title %}Salary Dashboard — Current Link ERP{% endblock %}
{% block body_class %}dashboard-body{% endblock %}
{% block page_title %}Employee Salary Dashboard{% endblock %}

{% block content %}
<style>
.sd-root { font-family: system-ui, -apple-system, sans-serif; }
.sd-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.sd-summary-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; text-align: center; transition: box-shadow .15s; }
.sd-summary-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.sd-summary-card .num { font-size: 1.6rem; font-weight: 800; line-height: 1.2; letter-spacing: -.5px; }
.sd-summary-card .label { font-size: .72rem; font-weight: 600; text-transform: uppercase; color: #64748b; letter-spacing: .4px; margin-top: 2px; }
.sd-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.sd-controls label { font-size: .82rem; font-weight: 600; color: #334155; }
.sd-controls select { padding: 8px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: .85rem; font-weight: 500; background: #fff; cursor: pointer; min-width: 160px; }
.sd-controls .badge { margin-left: auto; font-size: .72rem; font-weight: 600; color: #64748b; background: #f1f5f9; padding: 4px 12px; border-radius: 20px; }
.sd-table-wrap { overflow-x: auto; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px; }
.sd-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.sd-table th { background: #f8fafc; text-align: left; padding: 12px 16px; font-size: .72rem; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: .4px; border-bottom: 1.5px solid #e2e8f0; white-space: nowrap; }
.sd-table td { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; }
.sd-table tr:last-child td { border-bottom: none; }
.sd-table tr:hover td { background: #f8fafc; }
.sd-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .78rem; padding: 3px 12px; border-radius: 20px; white-space: nowrap; }
.sd-status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sd-paid { color: #059669; background: #ecfdf5; }
.sd-paid .sd-status-dot { background: #10b981; }
.sd-unpaid { color: #dc2626; background: #fef2f2; }
.sd-unpaid .sd-status-dot { background: #ef4444; }
.sd-pending { color: #d97706; background: #fffbeb; }
.sd-pending .sd-status-dot { background: #f59e0b; }
.sd-norecord { color: #94a3b8; background: #f8fafc; }
.sd-norecord .sd-status-dot { background: #cbd5e1; }
.sd-emp-name { font-weight: 600; color: #0f172a; }
.sd-emp-sub { font-size: .7rem; color: #94a3b8; }
.sd-loading { display: flex; align-items: center; justify-content: center; padding: 60px 20px; color: #64748b; gap: 10px; }
.sd-spinner { width: 20px; height: 20px; border: 2.5px solid #e2e8f0; border-top-color: #0f172a; border-radius: 50%; animation: sd-spin .6s linear infinite; }
@keyframes sd-spin { to { transform: rotate(360deg); } }
.sd-error { text-align: center; padding: 40px; color: #dc2626; font-weight: 500; }
@media (max-width: 640px) {
  .sd-summary { grid-template-columns: repeat(2, 1fr); }
  .sd-controls { flex-direction: column; align-items: stretch; }
  .sd-controls select { width: 100%; }
  .sd-controls .badge { margin-left: 0; text-align: center; }
}
</style>

<div id="salary-dashboard-root" class="sd-root"></div>
{% endblock %}

{% block extra_scripts %}
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const STATUS = { PAID: "Paid", UNPAID: "Unpaid", PENDING: "Pending", NO_RECORD: "No Record" };

function statusClass(s) {
  switch (s) {
    case STATUS.PAID: return "sd-paid";
    case STATUS.UNPAID: return "sd-unpaid";
    case STATUS.PENDING: return "sd-pending";
    default: return "sd-norecord";
  }
}

function formatMonthLabel(ym) {
  if (!ym) return "";
  const [y, m] = ym.split("-").map(Number);
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${names[m-1]} ${y}`;
}

function SummaryCards({ employees, selectedMonth }) {
  const total = employees.length;
  const counts = useMemo(() => {
    const c = { Paid:0, Unpaid:0, Pending:0 };
    employees.forEach(e => {
      const s = e.salaryStatus[selectedMonth] || STATUS.NO_RECORD;
      if (s === STATUS.PAID) c.Paid++;
      else if (s === STATUS.UNPAID) c.Unpaid++;
      else if (s === STATUS.PENDING) c.Pending++;
    });
    return c;
  }, [employees, selectedMonth]);

  const cards = [
    { label: "Total Employees", num: total, color: "#0f172a" },
    { label: "Paid", num: counts.Paid, color: "#10b981" },
    { label: "Unpaid", num: counts.Unpaid, color: "#ef4444" },
    { label: "Pending", num: counts.Pending, color: "#f59e0b" },
  ];

  return (
    <div className="sd-summary">
      {cards.map(c => (
        <div className="sd-summary-card" key={c.label}>
          <div className="num" style={{color: c.color}}>{c.num}</div>
          <div className="label">{c.label}</div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selectedMonth, setSelectedMonth] = useState("");

  useEffect(() => {
    fetch("/hr/api/salary-dashboard-data")
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(j => {
        setData(j);
        if (j.months && j.months.length > 0) setSelectedMonth(j.months[0]);
        setLoading(false);
      })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  if (loading) return <div className="sd-loading"><div className="sd-spinner"></div> Loading salary data…</div>;
  if (error) return <div className="sd-error">Failed to load: {error}</div>;
  if (!data || !data.employees) return <div className="sd-error">No data available</div>;

  const { employees, months } = data;
  const month = selectedMonth || (months && months[0]) || "";
  const filtered = employees.filter(e => e.salaryStatus[month] !== undefined);

  return (
    <>
      <SummaryCards employees={employees} selectedMonth={month} />

      <div className="sd-controls">
        <label htmlFor="month-select">📅 Month:</label>
        <select id="month-select" value={month} onChange={e => setSelectedMonth(e.target.value)}>
          {months.map(m => <option key={m} value={m}>{formatMonthLabel(m)}</option>)}
        </select>
        <span className="badge">{filtered.length} employees</span>
      </div>

      <div className="sd-table-wrap">
        <table className="sd-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Employee Name</th>
              <th>Department</th>
              <th>Salary Status</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((emp, i) => {
              const st = emp.salaryStatus[month] || STATUS.NO_RECORD;
              return (
                <tr key={emp.employee_id}>
                  <td style={{color:"#94a3b8", fontSize:".72rem"}}>{i + 1}</td>
                  <td>
                    <div className="sd-emp-name">{emp.name}</div>
                    {emp.status && <div className="sd-emp-sub">{emp.status}</div>}
                  </td>
                  <td style={{color:"#475569"}}>{emp.department || "—"}</td>
                  <td>
                    <span className={`sd-status ${statusClass(st)}`}>
                      <span className="sd-status-dot"></span>
                      {st}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("salary-dashboard-root"));
root.render(<App />);
</script>
{% endblock %}
